name: Build & Release APK
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://vtrdmjidwhzurgtndnjv.supabase.co
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }

      - name: Version from tag
        run: |
          VER="${GITHUB_REF_NAME#v}"
          IFS=. read MA MI PA <<< "$VER"
          CODE=$(( MA*10000 + MI*100 + PA ))
          echo "VER=$VER" >> $GITHUB_ENV
          echo "CODE=$CODE" >> $GITHUB_ENV

      - name: Prepare www (web files + update checker)
        run: |
          mkdir -p www
          for f in index.html manifest.json sw.js icon-192.png icon-512.png update-check.js; do
            [ -f "$f" ] && cp "$f" www/ || true
          done
          sed -i 's#</body>#<script src="update-check.js"></script></body>#' www/index.html
          grep -c "update-check.js" www/index.html

      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android

      - name: Install ImageMagick
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: Set version + icons
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" $G
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
            n=${d%%:*}; s=${d##*:}
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              [ -d $RES/mipmap-$n ] && convert www/icon-512.png -resize ${s}x${s} $RES/mipmap-$n/$f.png
            done
          done

      - name: Build
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon

      - name: Sign
        env:
          KS_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
