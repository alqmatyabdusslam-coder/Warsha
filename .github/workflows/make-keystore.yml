# يُشغَّل مرة واحدة فقط لإنشاء مفتاح التوقيع
name: Make keystore (one time)
on: workflow_dispatch
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Generate
        run: |
          PASS=$(openssl rand -hex 12)
          keytool -genkeypair -v -keystore warsha.jks -alias warsha -keyalg RSA -keysize 2048 -validity 36500 \
            -storepass "$PASS" -keypass "$PASS" -dname "CN=Warsha, O=Warsha, C=LY"
          base64 -w0 warsha.jks > KEYSTORE_BASE64.txt
          echo -n "$PASS" > KEYSTORE_PASSWORD.txt
      - uses: actions/upload-artifact@v4
        with:
          name: keystore-secrets
          path: |
            KEYSTORE_BASE64.txt
            KEYSTORE_PASSWORD.txt
            warsha.jks
          retention-days: 3
