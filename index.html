<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأصدقاء</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9480f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f5f7; --card:#ffffff; --text:#14181f; --muted:#6b7280; --line:#e3e6ea;
  --accent:#d9480f; --accent-text:#ffffff; --danger:#b42318; --price:#b4400a; --chip:#fdeee3;
  --warn:#9a5b00; --warn-bg:#fdf0d8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --card:#1a1f26; --text:#eef0f3; --muted:#9aa3af; --line:#2a313a;
    --accent:#ff8a3d; --accent-text:#2a1200; --danger:#f97066; --price:#ffb27a; --chip:#3a2312;
    --warn:#f5c26b; --warn-bg:#3a2e14;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --card:#1a1f26; --text:#eef0f3; --muted:#9aa3af; --line:#2a313a;
  --accent:#ff8a3d; --accent-text:#2a1200; --danger:#f97066; --price:#ffb27a; --chip:#3a2312;
  --warn:#f5c26b; --warn-bg:#3a2e14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 14px 40px}
body{--g1:8%;--g2:8%;
  background-image:linear-gradient(to bottom,color-mix(in srgb,var(--accent) var(--g1),transparent),transparent 40%),
  linear-gradient(to top,color-mix(in srgb,var(--accent) var(--g1),transparent),transparent 40%),
  linear-gradient(to right,color-mix(in srgb,var(--accent) var(--g2),transparent),transparent 45%),
  linear-gradient(to left,color-mix(in srgb,var(--accent) var(--g2),transparent),transparent 45%);
  background-attachment:fixed;background-repeat:no-repeat}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{--g1:12%;--g2:12%}}
:root[data-theme="dark"] body{--g1:12%;--g2:12%}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0}
.burger{width:46px;height:46px;flex:none;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:transparent;cursor:pointer;padding:0}
.burger i{display:block;width:3px;height:20px;border-radius:2px;background:var(--accent)}
.names{display:grid;gap:10px;margin:4px 0 14px}
.names button{font:inherit;font-size:20px;font-weight:700;padding:16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));background:transparent;color:var(--text);cursor:pointer}
.names button:active{background:var(--accent);color:var(--accent-text)}
.pickTitle{font-size:17px;font-weight:700;margin:0 0 10px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:8px 0}
.who{font-size:13px;color:var(--muted)}
.btn.plain{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.done{background:var(--accent);color:var(--accent-text)}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(88vw,380px);z-index:40;background:var(--bg);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:18px;margin:0}
.menu{display:flex;flex-direction:column;gap:8px;padding:14px}
.mitem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font:inherit;font-size:18px;font-weight:600;text-align:start;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer}
.mitem em{font-style:normal;font-size:14px;color:var(--accent-text);background:var(--accent);border-radius:999px;padding:1px 10px}
.dsum{padding:10px 14px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.dsum b{color:var(--price)}
.rec{display:flex;flex-direction:column;flex:1;min-height:0}
.dlist{flex:1;overflow-y:auto;padding:12px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.dlist .car .shot{max-height:130px}
@media (prefers-reduced-motion: reduce){.drawer,.veil{transition:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 14px}
h1{font-size:22px;margin:0}
.card{background:transparent;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=tel],input[type=search],input[type=email],input[type=password],select{
  width:100%;font:inherit;font-size:18px;padding:13px 14px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--text) 5%,transparent);color:var(--text);outline:none;
}
input:focus,select:focus,button:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.ltr{direction:ltr;text-align:right}
.btn{
  width:100%;font:inherit;font-size:18px;font-weight:700;border:0;border-radius:14px;
  padding:15px;background:var(--accent);color:var(--accent-text);cursor:pointer
}
.btn:disabled{opacity:.55}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-size:14px;font-weight:600;padding:8px 12px;width:auto}
.btn.small{font-size:14px;padding:8px 12px;width:auto;border-radius:10px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.msg{font-size:14px;margin-top:10px;min-height:20px}
.msg.err{color:var(--danger)} .msg.ok{color:var(--price)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar input{flex:1}
.stats{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;background:var(--chip);color:var(--price);border-radius:12px;padding:10px 12px;font-size:13px}
.chip b{display:block;font-size:19px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.filters button{
  font:inherit;font-size:14px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:transparent;
  color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer
}
.filters button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.car .plate{font-size:20px;font-weight:700;color:var(--price);direction:ltr;text-align:right}
.car .row{margin-top:4px;font-size:15px}
.car .row span{color:var(--muted)}
.car .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.car .acts a{
  text-decoration:none;font-size:14px;font-weight:600;color:var(--accent);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px
}
.car .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.car .foot select{width:auto;font-size:15px;padding:8px 10px;flex:1}
.car .date{font-size:12px;color:var(--muted);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.photoBtn{display:flex;align-items:center;justify-content:center;min-height:56px;border:2px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;font-size:16px}
.photoBtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.photoBtn img{width:100%;max-height:260px;object-fit:cover;display:block}
.car .shot{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block}
.car .amount{font-weight:700;color:var(--price)}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <button class="burger hidden" id="burger" type="button" aria-label="القائمة" aria-controls="drawer" aria-expanded="false"><i></i><i></i><i></i></button>
      <div><h1>الأصدقاء</h1><div class="who hidden" id="who"></div></div>
    </div>
    <button class="btn ghost hidden" id="switchUser" type="button">تغيير المستخدم</button>
  </div>

  <div id="banner" class="banner hidden"></div>

  <!-- اختيار الاسم ودخول المدير -->
  <div class="card hidden" id="pickCard">
    <p class="pickTitle">اختر اسمك</p>
    <div class="names" id="names"></div>
    <button class="link" id="adminToggle" type="button">دخول المدير</button>
    <div class="hidden" id="adminForm">
      <div class="field">
        <label for="aEmail">البريد الإلكتروني</label>
        <input id="aEmail" class="ltr" type="email" autocomplete="username" placeholder="name@example.com">
      </div>
      <div class="field">
        <label for="aPass">كلمة المرور</label>
        <input id="aPass" class="ltr" type="password" autocomplete="current-password">
      </div>
      <button class="btn" id="aLogin" type="button">تسجيل الدخول</button>
      <div class="msg" id="aMsg"></div>
    </div>
  </div>

  <!-- التطبيق -->
  <div id="app" class="hidden">
    <div class="card" id="formCard">
      <div class="field">
        <label for="carNumber">رقم السيارة</label>
        <input id="carNumber" class="ltr" type="text" autocomplete="off" placeholder="مثال: أ ب ج 1234">
      </div>
      <div class="field">
        <label for="model">موديل السيارة</label>
        <input id="model" type="text" autocomplete="off" placeholder="مثال: تويوتا كامري 2022">
      </div>
      <div class="field">
        <label for="phone">رقم هاتف الزبون</label>
        <input id="phone" class="ltr" type="text" autocomplete="off" placeholder="09XXXXXXXX">
      </div>
      <div class="field">
        <label for="issue">وصف المشكلة / الإصلاح</label>
        <input id="issue" type="text" autocomplete="off" placeholder="اكتب وصف العطل هنا...">
      </div>
      <div class="field">
        <label for="amount">القيمة</label>
        <input id="amount" class="ltr" type="text" autocomplete="off" placeholder="مثال: 150">
      </div>
      <div class="field">
        <label for="photo">تصوير</label>
        <div class="photoBtn" id="photoBox">
          <span id="photoHint">📷 اضغط لالتقاط صورة</span>
          <input id="photo" type="file" accept="image/*" capture="environment">
        </div>
      </div>
      <button class="btn" id="save" type="button">حفظ السيارة في السجل</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="bar"><input id="q" type="search" class="ltr" placeholder="🔍 ابحث برقم السيارة أو الهاتف أو الموديل"></div>

    <div class="stats">
      <div class="chip">داخل الورشة<b id="cnt">0</b></div>
      <div class="chip">قيد العمل<b id="cntWork">0</b></div>
      <div class="chip">جاهزة<b id="cntReady">0</b></div>
    </div>

    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>
</div>

<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-label="القائمة" aria-hidden="true">
  <div class="dhead">
    <button class="btn small plain hidden" id="back" type="button">→ رجوع</button>
    <h2 id="dtitle">القائمة</h2>
    <button class="btn small plain" id="close" type="button">إغلاق</button>
  </div>
  <div class="menu" id="menu">
    <button class="mitem" id="goRecords" type="button"><span>📋 السجل (المُسلَّمة)</span><em id="cntTab">0</em></button>
  </div>
  <div class="rec hidden" id="recView">
    <div class="dsum">إجمالي القيمة: <b id="dtotal">0</b></div>
    <div class="dlist" id="dlist"></div>
  </div>
</aside>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
<script>
(function(){
  // ====== الإعدادات: ضع بياناتك هنا ======
  const SUPABASE_URL = 'https://vtrdmjidwhzurgtndnjv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0cmRtamlkd2h6dXJndG5kbmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzOTIxNjUsImV4cCI6MjEwODk2ODE2NX0.NRLbGHxuxRJG_0YfgfATzYcC5-ZnkDIIm8PZeNgHyh4';
  const COUNTRY_CODE = '218'; // رمز الدولة لروابط واتساب (ليبيا 218)
  // ========================================

  const STATUSES = ['قيد العمل', 'جاهزة', 'تم التسليم'];
  const DELIVERED = STATUSES[2];
  const WORKERS = ['حسين', 'محمود', 'عبدو'];
  const normDigits = v => v.replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g, d => '۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const $ = id => document.getElementById(id);
  const el = {
    banner:$('banner'), pickCard:$('pickCard'), app:$('app'), switchUser:$('switchUser'), who:$('who'), names:$('names'),
    carNumber:$('carNumber'), model:$('model'), phone:$('phone'), issue:$('issue'),
    amount:$('amount'), photo:$('photo'), photoBox:$('photoBox'), photoHint:$('photoHint'),
    save:$('save'), msg:$('msg'), q:$('q'), list:$('list'), filters:$('filters')
  };

  function showBanner(t){ el.banner.textContent = t || ''; el.banner.classList.toggle('hidden', !t); }

  if(!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf('ضع_') === 0 || !window.supabase){
    showBanner(!window.supabase
      ? 'تعذر تحميل مكتبة Supabase. تحقق من الاتصال بالإنترنت.'
      : 'لم يتم ضبط مفتاح Supabase. افتح الملف وضع المفتاح الكامل في SUPABASE_ANON_KEY.');
    return;
  }

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allCars = [];
  let statusFilter = 'الكل';
  let channel = null;

  function setMsg(node, t, cls){ node.textContent = t || ''; node.className = 'msg ' + (cls || ''); }

  // ---------- التحقق ----------
  function validPhone(v){
    const digits = v.replace(/[\s\-()]/g, '');
    return /^\+?\d{7,15}$/.test(digits);
  }
  function waLink(phone){
    let d = phone.replace(/\D/g, '');
    if(phone.trim().startsWith('+')) return 'https://wa.me/' + d;
    if(d.startsWith('00')) d = d.slice(2);
    else if(d.startsWith('0')) d = COUNTRY_CODE + d.slice(1);
    return 'https://wa.me/' + d;
  }
  function telLink(phone){ return 'tel:' + phone.replace(/[^\d+]/g, ''); }

  // fetchCars / subscribe معرّفتان أدناه

  // ---------- البيانات ----------
  async function fetchCars(){
    try {
      const { data, error } = await db.from('cars').select('*').order('created_at', { ascending: false });
      if(error) throw error;
      allCars = data || [];
      showBanner('');
      render();
    } catch(e){
      showBanner('تعذر جلب البيانات. سيُعاد المحاولة تلقائياً عند عودة الاتصال.');
    }
  }

  function subscribe(){
    if(channel) return;
    try {
      channel = db.channel('cars-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'cars' }, () => fetchCars())
        .subscribe();
    } catch(e){ /* التحديث الفوري اختياري */ }
  }
  window.addEventListener('online', () => { if(!el.app.classList.contains('hidden')) fetchCars(); });

  // ---------- الصورة (تُصغَّر قبل الحفظ) ----------
  let photoData = '';
  function compressImage(file, maxSide, quality){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }
  function resetPhoto(){
    photoData = '';
    el.photo.value = '';
    const old = el.photoBox.querySelector('img');
    if(old) old.remove();
    el.photoHint.classList.remove('hidden');
  }
  el.photo.addEventListener('change', async () => {
    const f = el.photo.files && el.photo.files[0];
    if(!f) return;
    try {
      photoData = await compressImage(f, 800, 0.6);
      const old = el.photoBox.querySelector('img');
      if(old) old.remove();
      const im = document.createElement('img');
      im.src = photoData;
      im.alt = 'الصورة الملتقطة';
      el.photoBox.appendChild(im);
      el.photoHint.classList.add('hidden');
    } catch(e){
      setMsg(el.msg, 'تعذر قراءة الصورة', 'err');
    }
  });

  // ---------- اختيار الاسم ----------
  let worker = null, isAdmin = false;
  try { worker = localStorage.getItem('wrsha_worker'); } catch(e){}
  if(worker && WORKERS.indexOf(worker) === -1) worker = null;

  function showWorker(){
    const on = !!worker;
    el.pickCard.classList.toggle('hidden', on);
    el.app.classList.toggle('hidden', !on);
    el.switchUser.classList.toggle('hidden', !on);
    el.who.classList.toggle('hidden', !on);
    $('burger').classList.toggle('hidden', !on);
    el.who.textContent = on ? 'المستخدم: ' + worker : '';
    if(on){ fetchCars(); subscribe(); } else { openDrawer(false); }
  }
  WORKERS.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = n;
    b.addEventListener('click', () => {
      worker = n;
      try { localStorage.setItem('wrsha_worker', n); } catch(e){}
      showWorker();
    });
    el.names.appendChild(b);
  });
  $('adminToggle').addEventListener('click', () => $('adminForm').classList.toggle('hidden'));
  $('aLogin').addEventListener('click', async () => {
    const email = $('aEmail').value.trim(), password = $('aPass').value;
    if(!email || !password){ setMsg($('aMsg'), 'أدخل البريد وكلمة المرور', 'err'); return; }
    $('aLogin').disabled = true; setMsg($('aMsg'), 'جارٍ الدخول…');
    const { error } = await db.auth.signInWithPassword({ email, password });
    $('aLogin').disabled = false;
    if(error){ setMsg($('aMsg'), 'البريد أو كلمة المرور غير صحيحة', 'err'); return; }
    $('aPass').value = ''; setMsg($('aMsg'), '');
    isAdmin = true; worker = 'المدير'; showWorker();
  });
  $('aPass').addEventListener('keydown', e => { if(e.key === 'Enter') $('aLogin').click(); });
  el.switchUser.addEventListener('click', () => {
    if(isAdmin){ db.auth.signOut(); isAdmin = false; }
    worker = null;
    try { localStorage.removeItem('wrsha_worker'); } catch(e){}
    showWorker();
  });
  db.auth.getSession().then(({ data }) => {
    if(data.session){ isAdmin = true; worker = 'المدير'; }
    showWorker();
  });

  el.save.addEventListener('click', async () => {
    const car_number = el.carNumber.value.trim();
    const model = el.model.value.trim();
    const customer_phone = normDigits(el.phone.value.trim());
    const issue_description = el.issue.value.trim();
    const amountRaw = normDigits(el.amount.value.trim()).replace(/[,٫،]/g, '.');
    if(amountRaw !== '' && !(Number(amountRaw) >= 0)){ setMsg(el.msg, 'القيمة غير صحيحة (أرقام فقط)', 'err'); el.amount.focus(); return; }
    const amount = amountRaw === '' ? null : Number(amountRaw);

    if(!car_number){ setMsg(el.msg, 'يرجى إدخال رقم السيارة', 'err'); el.carNumber.focus(); return; }
    if(!customer_phone){ setMsg(el.msg, 'يرجى إدخال رقم هاتف الزبون', 'err'); el.phone.focus(); return; }
    if(!validPhone(customer_phone)){ setMsg(el.msg, 'رقم الهاتف غير صحيح (أرقام فقط، من 7 إلى 15 رقماً)', 'err'); el.phone.focus(); return; }

    el.save.disabled = true;
    setMsg(el.msg, 'جارٍ الحفظ…');
    try {
      const row = { car_number, model, customer_phone, issue_description, amount, photo: photoData || null, status: STATUSES[0], added_by: worker };
      let { error } = await db.from('cars').insert([row]);
      if(error && /added_by/.test(error.message || '')){
        delete row.added_by;
        ({ error } = await db.from('cars').insert([row]));
      }
      if(error) throw error;
      setMsg(el.msg, 'تم حفظ السيارة بنجاح ✓', 'ok');
      el.carNumber.value = el.model.value = el.phone.value = el.issue.value = el.amount.value = '';
      resetPhoto();
      fetchCars();
      setTimeout(() => setMsg(el.msg, ''), 2500);
    } catch(e){
      setMsg(el.msg, 'فشل الحفظ: ' + (e.message || 'حاول مرة أخرى'), 'err');
    } finally {
      el.save.disabled = false;
    }
  });

  async function updateStatus(car, status, selectEl){
    const old = car.status;
    car.status = status;
    render();
    const { error } = await db.from('cars').update({ status }).eq('id', car.id);
    if(error){
      car.status = old;
      selectEl.value = old;
      render();
      showBanner('تعذر تحديث الحالة: ' + (error.message || 'حاول مرة أخرى'));
      setTimeout(() => showBanner(''), 4000);
    }
  }

  async function deleteCar(car){
    if(!confirm('حذف السيارة ' + car.car_number + ' من السجل؟ لا يمكن التراجع.')) return;
    const { error } = await db.from('cars').delete().eq('id', car.id);
    if(error){ showBanner('تعذر الحذف: ' + (error.message || '')); setTimeout(() => showBanner(''), 4000); return; }
    allCars = allCars.filter(c => c.id !== car.id);
    render();
  }

  // ---------- العرض ----------
  el.q.addEventListener('input', render);

  function renderFilters(){
    el.filters.textContent = '';
    ['الكل', STATUSES[0], STATUSES[1]].forEach(s => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = s;
      if(s === statusFilter) b.className = 'on';
      b.addEventListener('click', () => { statusFilter = s; render(); });
      el.filters.appendChild(b);
    });
  }

  function renderStats(){
    const inside = allCars.filter(c => c.status !== DELIVERED);
    $('cnt').textContent = inside.length;
    $('cntWork').textContent = inside.filter(c => (c.status || STATUSES[0]) === STATUSES[0]).length;
    $('cntReady').textContent = inside.filter(c => c.status === STATUSES[1]).length;
    renderRecords();
  }

  function line(label, value){
    const d = document.createElement('div');
    d.className = 'row';
    const s = document.createElement('span');
    s.textContent = label + ': ';
    d.appendChild(s);
    d.appendChild(document.createTextNode(value));
    return d;
  }

  function render(){
    const q = el.q.value.trim().toLowerCase();
    const filtered = allCars.filter(r => {
      const st = r.status || STATUSES[0];
      if(st === DELIVERED) return false;
      if(statusFilter !== 'الكل' && st !== statusFilter) return false;
      return !q ||
        String(r.car_number || '').toLowerCase().includes(q) ||
        String(r.customer_phone || '').toLowerCase().includes(q) ||
        String(r.model || '').toLowerCase().includes(q);
    });

    renderStats();
    renderFilters();
    el.list.textContent = '';

    if(!filtered.length){
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = (q || statusFilter !== 'الكل') ? 'لا توجد نتائج مطابقة' : 'لا توجد سيارات مسجلة. أضف أول سيارة من النموذج أعلاه.';
      el.list.appendChild(d);
      return;
    }

    filtered.forEach(r => el.list.appendChild(buildCard(r, false)));
  }

  function buildCard(r, delivered){
      const card = document.createElement('div');
      card.className = 'card car';

      if(r.photo){
        const shot = document.createElement('img');
        shot.className = 'shot';
        shot.src = r.photo;
        shot.alt = 'صورة السيارة ' + r.car_number;
        shot.loading = 'lazy';
        card.appendChild(shot);
      }

      const plate = document.createElement('div');
      plate.className = 'plate';
      plate.textContent = '🚗 ' + r.car_number;
      card.appendChild(plate);

      card.appendChild(line('الموديل', r.model || 'غير محدد'));
      const ph = line('الهاتف', r.customer_phone);
      ph.lastChild.parentNode.style.direction = 'rtl';
      card.appendChild(ph);
      card.appendChild(line('المشكلة', r.issue_description || 'لا توجد ملاحظات'));
      if(r.amount !== null && r.amount !== undefined && r.amount !== ''){
        const av = line('القيمة', String(r.amount));
        av.lastChild.parentNode.classList.add('amount');
        card.appendChild(av);
      }

      const acts = document.createElement('div');
      acts.className = 'acts';
      const call = document.createElement('a');
      call.href = telLink(r.customer_phone);
      call.textContent = '📞 اتصال';
      const wa = document.createElement('a');
      wa.href = waLink(r.customer_phone);
      wa.target = '_blank';
      wa.rel = 'noopener noreferrer';
      wa.textContent = '💬 واتساب';
      acts.appendChild(call);
      acts.appendChild(wa);
      card.appendChild(acts);

      const foot = document.createElement('div');
      foot.className = 'foot';
      const sel = document.createElement('select');
      sel.setAttribute('aria-label', 'حالة السيارة');
      STATUSES.forEach(s => {
        const o = document.createElement('option');
        o.value = s; o.textContent = s;
        sel.appendChild(o);
      });
      sel.value = r.status || STATUSES[0];
      sel.addEventListener('change', () => updateStatus(r, sel.value, sel));
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn small danger';
      del.textContent = 'حذف';
      del.addEventListener('click', () => deleteCar(r));
      const mk = (t, cls, fn) => { const b = document.createElement('button'); b.type = 'button'; b.className = 'btn small ' + cls; b.textContent = t; b.addEventListener('click', fn); return b; };
      if(delivered){
        foot.appendChild(mk('↩ إرجاع للورشة', 'plain', () => updateStatus(r, STATUSES[0], {})));
        if(isAdmin) foot.appendChild(del);
      } else {
        foot.appendChild(sel);
        foot.appendChild(mk('✅ تسليم', 'done', () => updateStatus(r, DELIVERED, sel)));
        if(isAdmin) foot.appendChild(del);
      }
      card.appendChild(foot);

      if(r.added_by){ const ab = document.createElement('div'); ab.className = 'date'; ab.textContent = 'أضافها: ' + r.added_by; card.appendChild(ab); }
      if(r.created_at){
        const dt = document.createElement('div');
        dt.className = 'date';
        dt.textContent = new Date(r.created_at).toLocaleString('ar-EG');
        card.appendChild(dt);
      }

      return card;
  }

  function renderRecords(){
    const done = allCars.filter(c => c.status === DELIVERED);
    const box = $('dlist');
    box.textContent = '';
    if(!done.length){
      const d = document.createElement('div'); d.className = 'empty'; d.textContent = 'لم يتم تسليم أي سيارة بعد.'; box.appendChild(d);
    }
    done.forEach(r => box.appendChild(buildCard(r, true)));
    const total = done.reduce((t, c) => t + (Number(c.amount) || 0), 0);
    $('dtotal').textContent = Math.round(total * 100) / 100;
    $('cntTab').textContent = done.length;
  }

  // ---------- القائمة الجانبية ----------
  function showView(name){
    const rec = name === 'records';
    $('menu').classList.toggle('hidden', rec);
    $('recView').classList.toggle('hidden', !rec);
    $('back').classList.toggle('hidden', !rec);
    $('dtitle').textContent = rec ? 'السجل' : 'القائمة';
  }
  function openDrawer(on){
    if(on) showView('menu');
    $('drawer').classList.toggle('on', on);
    $('veil').classList.toggle('on', on);
    $('drawer').setAttribute('aria-hidden', on ? 'false' : 'true');
    $('burger').setAttribute('aria-expanded', on ? 'true' : 'false');
  }
  $('burger').addEventListener('click', () => openDrawer(true));
  $('close').addEventListener('click', () => openDrawer(false));
  $('veil').addEventListener('click', () => openDrawer(false));
  $('goRecords').addEventListener('click', () => showView('records'));
  $('back').addEventListener('click', () => showView('menu'));
  document.addEventListener('keydown', e => { if(e.key === 'Escape') openDrawer(false); });

  // ---------- نجوم برتقالية في الخلفية ----------
  (function(){
    const cv = $('stars'), cx = cv.getContext('2d');
    let W = 0, H = 0, stars = [], color = '255,138,61';
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    function readColor(){
      const m = /^#([0-9a-f]{6})$/i.exec(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim());
      if(m){ const n = parseInt(m[1], 16); color = (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255); }
    }
    function size(){
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.max(120, Math.min(300, Math.round(W * H / 2800)));
      stars = [];
      for(let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.35 + Math.random() * 0.7,
        vy: 0.08 + Math.random() * 0.22, vx: (Math.random() - 0.5) * 0.12, ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.6 });
      draw(0);
    }
    function draw(t){
      cx.clearRect(0, 0, W, H);
      for(const s of stars){
        const a = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(s.ph + t * 0.001 * s.sp));
        cx.fillStyle = 'rgba(' + color + ',' + a.toFixed(2) + ')';
        cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.2832); cx.fill();
        if(!still){
          s.y -= s.vy; s.x += s.vx;
          if(s.y < -4){ s.y = H + 4; s.x = Math.random() * W; }
          if(s.x < -4) s.x = W + 4; else if(s.x > W + 4) s.x = -4;
        }
      }
    }
    function loop(t){ if(!document.hidden) draw(t); requestAnimationFrame(loop); }
    readColor(); size();
    addEventListener('resize', size);
    if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(() => { readColor(); draw(0); }, 50));
    if(!still) requestAnimationFrame(loop);
  })();
})();
</script>
</body>
