<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>سجل الورشة - WRSHA</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f5f7; --card:#ffffff; --text:#14181f; --muted:#6b7280; --line:#e3e6ea;
  --accent:#0f6e56; --accent-text:#ffffff; --danger:#b42318; --price:#0b5d47; --chip:#e8f3ef;
  --warn:#9a5b00; --warn-bg:#fdf0d8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --card:#1a1f26; --text:#eef0f3; --muted:#9aa3af; --line:#2a313a;
    --accent:#2fb58f; --accent-text:#06231b; --danger:#f97066; --price:#5fd3ae; --chip:#16322a;
    --warn:#f5c26b; --warn-bg:#3a2e14;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --card:#1a1f26; --text:#eef0f3; --muted:#9aa3af; --line:#2a313a;
  --accent:#2fb58f; --accent-text:#06231b; --danger:#f97066; --price:#5fd3ae; --chip:#16322a;
  --warn:#f5c26b; --warn-bg:#3a2e14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 14px}
h1{font-size:22px;margin:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=tel],input[type=search],input[type=email],input[type=password],select{
  width:100%;font:inherit;font-size:18px;padding:13px 14px;border-radius:12px;
  border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none;
}
input:focus,select:focus,button:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.ltr{direction:ltr;text-align:right}
.btn{
  width:100%;font:inherit;font-size:18px;font-weight:700;border:0;border-radius:14px;
  padding:15px;background:var(--accent);color:var(--accent-text);cursor:pointer
}
.btn:disabled{opacity:.55}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-size:14px;font-weight:600;padding:8px 12px;width:auto}
.btn.small{font-size:14px;padding:8px 12px;width:auto;border-radius:10px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.msg{font-size:14px;margin-top:10px;min-height:20px}
.msg.err{color:var(--danger)} .msg.ok{color:var(--price)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar input{flex:1}
.stats{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;background:var(--chip);color:var(--price);border-radius:12px;padding:10px 12px;font-size:13px}
.chip b{display:block;font-size:19px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.filters button{
  font:inherit;font-size:14px;white-space:nowrap;border:1px solid var(--line);background:var(--card);
  color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer
}
.filters button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.car .plate{font-size:20px;font-weight:700;color:var(--price);direction:ltr;text-align:right}
.car .row{margin-top:4px;font-size:15px}
.car .row span{color:var(--muted)}
.car .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.car .acts a{
  text-decoration:none;font-size:14px;font-weight:600;color:var(--accent);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px
}
.car .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.car .foot select{width:auto;font-size:15px;padding:8px 10px;flex:1}
.car .date{font-size:12px;color:var(--muted);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>🔧 سجل ورشة WRSHA</h1>
    <button class="btn ghost hidden" id="logout" type="button">تسجيل الخروج</button>
  </div>

  <div id="banner" class="banner hidden"></div>

  <!-- تسجيل الدخول -->
  <div class="card hidden" id="loginCard">
    <div class="field">
      <label for="email">البريد الإلكتروني</label>
      <input id="email" class="ltr" type="email" autocomplete="username" placeholder="name@example.com">
    </div>
    <div class="field">
      <label for="password">كلمة المرور</label>
      <input id="password" class="ltr" type="password" autocomplete="current-password">
    </div>
    <button class="btn" id="login" type="button">تسجيل الدخول</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <!-- التطبيق -->
  <div id="app" class="hidden">
    <div class="card" id="formCard">
      <div class="field">
        <label for="carNumber">رقم السيارة</label>
        <input id="carNumber" class="ltr" type="text" autocomplete="off" placeholder="مثال: أ ب ج 1234">
      </div>
      <div class="field">
        <label for="model">موديل السيارة</label>
        <input id="model" type="text" autocomplete="off" placeholder="مثال: تويوتا كامري 2022">
      </div>
      <div class="field">
        <label for="phone">رقم هاتف الزبون</label>
        <input id="phone" class="ltr" type="tel" inputmode="tel" autocomplete="off" placeholder="09XXXXXXXX">
      </div>
      <div class="field">
        <label for="issue">وصف المشكلة / الإصلاح</label>
        <input id="issue" type="text" autocomplete="off" placeholder="اكتب وصف العطل هنا...">
      </div>
      <button class="btn" id="save" type="button">حفظ السيارة في السجل</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="bar"><input id="q" type="search" class="ltr" placeholder="🔍 ابحث برقم السيارة أو الهاتف أو الموديل"></div>

    <div class="stats">
      <div class="chip">إجمالي السيارات<b id="cnt">0</b></div>
      <div class="chip">قيد العمل<b id="cntWork">0</b></div>
      <div class="chip">جاهزة<b id="cntReady">0</b></div>
    </div>

    <div class="filters" id="filters"></div>
    <div id="list"></div>
  </div>
</div>

<script>
(function(){
  // ====== الإعدادات: ضع بياناتك هنا ======
  const SUPABASE_URL = 'https://vtrdmjidwhzurgtndnjv.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ0cmRtamlkd2h6dXJndG5kbmp2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzOTIxNjUsImV4cCI6MjEwODk2ODE2NX0.NRLbGHxuxRJG_0YfgfATzYcC5-ZnkDIIm8PZeNgHyh4';
  const COUNTRY_CODE = '218'; // رمز الدولة لروابط واتساب (ليبيا 218)
  // ========================================

  const STATUSES = ['قيد العمل', 'جاهزة', 'تم التسليم'];
  const $ = id => document.getElementById(id);
  const el = {
    banner:$('banner'), loginCard:$('loginCard'), app:$('app'), logout:$('logout'),
    email:$('email'), password:$('password'), login:$('login'), loginMsg:$('loginMsg'),
    carNumber:$('carNumber'), model:$('model'), phone:$('phone'), issue:$('issue'),
    save:$('save'), msg:$('msg'), q:$('q'), list:$('list'), filters:$('filters')
  };

  function showBanner(t){ el.banner.textContent = t || ''; el.banner.classList.toggle('hidden', !t); }

  if(!SUPABASE_ANON_KEY || SUPABASE_ANON_KEY.indexOf('ضع_') === 0 || !window.supabase){
    showBanner(!window.supabase
      ? 'تعذر تحميل مكتبة Supabase. تحقق من الاتصال بالإنترنت.'
      : 'لم يتم ضبط مفتاح Supabase. افتح الملف وضع المفتاح الكامل في SUPABASE_ANON_KEY.');
    return;
  }

  const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let allCars = [];
  let statusFilter = 'الكل';
  let channel = null;

  function setMsg(node, t, cls){ node.textContent = t || ''; node.className = 'msg ' + (cls || ''); }

  // ---------- التحقق ----------
  function validPhone(v){
    const digits = v.replace(/[\s\-()]/g, '');
    return /^\+?\d{7,15}$/.test(digits);
  }
  function waLink(phone){
    let d = phone.replace(/\D/g, '');
    if(phone.trim().startsWith('+')) return 'https://wa.me/' + d;
    if(d.startsWith('00')) d = d.slice(2);
    else if(d.startsWith('0')) d = COUNTRY_CODE + d.slice(1);
    return 'https://wa.me/' + d;
  }
  function telLink(phone){ return 'tel:' + phone.replace(/[^\d+]/g, ''); }

  // ---------- المصادقة ----------
  async function onSession(session){
    const signedIn = !!session;
    el.loginCard.classList.toggle('hidden', signedIn);
    el.app.classList.toggle('hidden', !signedIn);
    el.logout.classList.toggle('hidden', !signedIn);
    if(signedIn){
      await fetchCars();
      subscribe();
    } else {
      allCars = [];
      if(channel){ db.removeChannel(channel); channel = null; }
    }
  }

  el.login.addEventListener('click', async () => {
    const email = el.email.value.trim(), password = el.password.value;
    if(!email || !password){ setMsg(el.loginMsg, 'أدخل البريد وكلمة المرور', 'err'); return; }
    el.login.disabled = true;
    setMsg(el.loginMsg, 'جارٍ تسجيل الدخول…');
    const { error } = await db.auth.signInWithPassword({ email, password });
    el.login.disabled = false;
    if(error){ setMsg(el.loginMsg, 'البريد أو كلمة المرور غير صحيحة', 'err'); return; }
    el.password.value = '';
    setMsg(el.loginMsg, '');
  });
  el.password.addEventListener('keydown', e => { if(e.key === 'Enter') el.login.click(); });
  el.logout.addEventListener('click', () => db.auth.signOut());

  db.auth.onAuthStateChange((_evt, session) => { onSession(session); });
  db.auth.getSession().then(({ data }) => onSession(data.session));

  // ---------- البيانات ----------
  async function fetchCars(){
    try {
      const { data, error } = await db.from('cars').select('*').order('created_at', { ascending: false });
      if(error) throw error;
      allCars = data || [];
      showBanner('');
      render();
    } catch(e){
      showBanner('تعذر جلب البيانات. سيُعاد المحاولة تلقائياً عند عودة الاتصال.');
    }
  }

  function subscribe(){
    if(channel) return;
    try {
      channel = db.channel('cars-changes')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'cars' }, () => fetchCars())
        .subscribe();
    } catch(e){ /* التحديث الفوري اختياري */ }
  }
  window.addEventListener('online', () => { if(!el.app.classList.contains('hidden')) fetchCars(); });

  el.save.addEventListener('click', async () => {
    const car_number = el.carNumber.value.trim();
    const model = el.model.value.trim();
    const customer_phone = el.phone.value.trim();
    const issue_description = el.issue.value.trim();

    if(!car_number){ setMsg(el.msg, 'يرجى إدخال رقم السيارة', 'err'); el.carNumber.focus(); return; }
    if(!customer_phone){ setMsg(el.msg, 'يرجى إدخال رقم هاتف الزبون', 'err'); el.phone.focus(); return; }
    if(!validPhone(customer_phone)){ setMsg(el.msg, 'رقم الهاتف غير صحيح (أرقام فقط، من 7 إلى 15 رقماً)', 'err'); el.phone.focus(); return; }

    el.save.disabled = true;
    setMsg(el.msg, 'جارٍ الحفظ…');
    try {
      const { error } = await db.from('cars').insert([{ car_number, model, customer_phone, issue_description, status: STATUSES[0] }]);
      if(error) throw error;
      setMsg(el.msg, 'تم حفظ السيارة بنجاح ✓', 'ok');
      el.carNumber.value = el.model.value = el.phone.value = el.issue.value = '';
      fetchCars();
      setTimeout(() => setMsg(el.msg, ''), 2500);
    } catch(e){
      setMsg(el.msg, 'فشل الحفظ: ' + (e.message || 'حاول مرة أخرى'), 'err');
    } finally {
      el.save.disabled = false;
    }
  });

  async function updateStatus(car, status, selectEl){
    const old = car.status;
    car.status = status;
    renderStats();
    const { error } = await db.from('cars').update({ status }).eq('id', car.id);
    if(error){
      car.status = old;
      selectEl.value = old;
      renderStats();
      showBanner('تعذر تحديث الحالة: ' + (error.message || 'حاول مرة أخرى'));
      setTimeout(() => showBanner(''), 4000);
    }
  }

  async function deleteCar(car){
    if(!confirm('حذف السيارة ' + car.car_number + ' من السجل؟ لا يمكن التراجع.')) return;
    const { error } = await db.from('cars').delete().eq('id', car.id);
    if(error){ showBanner('تعذر الحذف: ' + (error.message || '')); setTimeout(() => showBanner(''), 4000); return; }
    allCars = allCars.filter(c => c.id !== car.id);
    render();
  }

  // ---------- العرض ----------
  el.q.addEventListener('input', render);

  function renderFilters(){
    el.filters.textContent = '';
    ['الكل'].concat(STATUSES).forEach(s => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = s;
      if(s === statusFilter) b.className = 'on';
      b.addEventListener('click', () => { statusFilter = s; render(); });
      el.filters.appendChild(b);
    });
  }

  function renderStats(){
    $('cnt').textContent = allCars.length;
    $('cntWork').textContent = allCars.filter(c => (c.status || STATUSES[0]) === STATUSES[0]).length;
    $('cntReady').textContent = allCars.filter(c => c.status === STATUSES[1]).length;
  }

  function line(label, value){
    const d = document.createElement('div');
    d.className = 'row';
    const s = document.createElement('span');
    s.textContent = label + ': ';
    d.appendChild(s);
    d.appendChild(document.createTextNode(value));
    return d;
  }

  function render(){
    const q = el.q.value.trim().toLowerCase();
    const filtered = allCars.filter(r => {
      const st = r.status || STATUSES[0];
      if(statusFilter !== 'الكل' && st !== statusFilter) return false;
      return !q ||
        String(r.car_number || '').toLowerCase().includes(q) ||
        String(r.customer_phone || '').toLowerCase().includes(q) ||
        String(r.model || '').toLowerCase().includes(q);
    });

    renderStats();
    renderFilters();
    el.list.textContent = '';

    if(!filtered.length){
      const d = document.createElement('div');
      d.className = 'empty';
      d.textContent = (q || statusFilter !== 'الكل') ? 'لا توجد نتائج مطابقة' : 'لا توجد سيارات مسجلة. أضف أول سيارة من النموذج أعلاه.';
      el.list.appendChild(d);
      return;
    }

    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'card car';

      const plate = document.createElement('div');
      plate.className = 'plate';
      plate.textContent = '🚗 ' + r.car_number;
      card.appendChild(plate);

      card.appendChild(line('الموديل', r.model || 'غير محدد'));
      const ph = line('الهاتف', r.customer_phone);
      ph.lastChild.parentNode.style.direction = 'rtl';
      card.appendChild(ph);
      card.appendChild(line('المشكلة', r.issue_description || 'لا توجد ملاحظات'));

      const acts = document.createElement('div');
      acts.className = 'acts';
      const call = document.createElement('a');
      call.href = telLink(r.customer_phone);
      call.textContent = '📞 اتصال';
      const wa = document.createElement('a');
      wa.href = waLink(r.customer_phone);
      wa.target = '_blank';
      wa.rel = 'noopener noreferrer';
      wa.textContent = '💬 واتساب';
      acts.appendChild(call);
      acts.appendChild(wa);
      card.appendChild(acts);

      const foot = document.createElement('div');
      foot.className = 'foot';
      const sel = document.createElement('select');
      sel.setAttribute('aria-label', 'حالة السيارة');
      STATUSES.forEach(s => {
        const o = document.createElement('option');
        o.value = s; o.textContent = s;
        sel.appendChild(o);
      });
      sel.value = r.status || STATUSES[0];
      sel.addEventListener('change', () => updateStatus(r, sel.value, sel));
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'btn small danger';
      del.textContent = 'حذف';
      del.addEventListener('click', () => deleteCar(r));
      foot.appendChild(sel);
      foot.appendChild(del);
      card.appendChild(foot);

      if(r.created_at){
        const dt = document.createElement('div');
        dt.className = 'date';
        dt.textContent = new Date(r.created_at).toLocaleString('ar-EG');
        card.appendChild(dt);
      }

      el.list.appendChild(card);
    });
  }
})();
</script>
</body>
</html>
