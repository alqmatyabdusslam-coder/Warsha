<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الأصدقاء</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#d9480f">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f4f5f7; --card:#ffffff; --text:#14181f; --muted:#6b7280; --line:#e3e6ea;
  --accent:#d9480f; --accent-text:#ffffff; --danger:#b42318; --price:#b4400a; --chip:#fdeee3;
  --warn:#9a5b00; --warn-bg:#fdf0d8;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101317; --card:#1a1f26; --text:#eef0f3; --muted:#9aa3af; --line:#2a313a;
    --accent:#ff8a3d; --accent-text:#2a1200; --danger:#f97066; --price:#ffb27a; --chip:#3a2312;
    --warn:#f5c26b; --warn-bg:#3a2e14;
  }
}
:root[data-theme="dark"]{
  --bg:#101317; --card:#1a1f26; --text:#eef0f3; --muted:#9aa3af; --line:#2a313a;
  --accent:#ff8a3d; --accent-text:#2a1200; --danger:#f97066; --price:#ffb27a; --chip:#3a2312;
  --warn:#f5c26b; --warn-bg:#3a2e14;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",system-ui,-apple-system,sans-serif;
  font-size:16px; line-height:1.5; -webkit-text-size-adjust:100%;
}
.wrap{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:16px 14px 40px}
body{--g1:8%;--g2:8%;
  background-image:linear-gradient(to bottom,color-mix(in srgb,var(--accent) var(--g1),transparent),transparent 40%),
  linear-gradient(to top,color-mix(in srgb,var(--accent) var(--g1),transparent),transparent 40%),
  linear-gradient(to right,color-mix(in srgb,var(--accent) var(--g2),transparent),transparent 45%),
  linear-gradient(to left,color-mix(in srgb,var(--accent) var(--g2),transparent),transparent 45%);
  background-attachment:fixed;background-repeat:no-repeat}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{--g1:12%;--g2:12%}}
:root[data-theme="dark"] body{--g1:12%;--g2:12%}
#stars{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.brand{display:flex;align-items:center;gap:10px}
.brand h1{margin:0}
.burger{width:46px;height:46px;flex:none;display:flex;flex-direction:row;align-items:center;justify-content:center;gap:6px;border:0;border-radius:12px;background:transparent;cursor:pointer;padding:0}
.burger i{display:block;width:3px;height:20px;border-radius:2px;background:var(--accent)}
.names{display:grid;gap:10px;margin:4px 0 14px}
.names button{font:inherit;font-size:20px;font-weight:700;padding:16px;border-radius:14px;border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));background:transparent;color:var(--text);cursor:pointer}
.names button:active{background:var(--accent);color:var(--accent-text)}
.pickTitle{font-size:17px;font-weight:700;margin:0 0 10px}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;font:inherit;font-size:14px;cursor:pointer;padding:8px 0}
.who{font-size:13px;color:var(--muted)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.seg button{font:inherit;font-size:16px;font-weight:700;padding:13px 6px;border-radius:12px;border:1px solid color-mix(in srgb,var(--accent) 45%,var(--line));background:transparent;color:var(--text);cursor:pointer}
.seg button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.warnBox{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:15px;font-weight:600;margin-bottom:12px}
.tag{display:inline-block;background:var(--chip);color:var(--price);border-radius:999px;padding:2px 12px;font-size:14px;font-weight:700}
.car .extra{font-size:14px;color:var(--muted);margin:2px 0 0;padding-inline-start:10px}
.car .total{font-size:19px;font-weight:700;color:var(--price);margin-top:6px}
.xform{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.xform .field{margin-bottom:10px}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--bg);border:1px solid var(--line);border-radius:16px;padding:16px;width:min(100%,420px)}
.modal h3{margin:0 0 10px;font-size:19px}
.modal .req{font-size:16px;margin-bottom:12px}
.modal .req b{color:var(--price)}
.diff{font-size:14px;min-height:20px;margin:-6px 0 10px}
.diff.neg{color:var(--danger)}
.mbtns{display:flex;gap:8px;margin-top:6px}
.mbtns .btn{width:auto;flex:1;font-size:16px}
.chk{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:16px;color:var(--text);cursor:pointer}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.sw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:16px}
.sw:first-of-type{border-top:0}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.btn.plain{background:transparent;color:var(--text);border:1px solid var(--line)}
.btn.done{background:var(--accent);color:var(--accent-text)}
.veil{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.veil.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;bottom:0;right:0;width:min(88vw,380px);z-index:40;background:var(--bg);border-left:1px solid var(--line);transform:translateX(105%);transition:transform .22s ease;display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px;border-bottom:1px solid var(--line)}
.dhead h2{font-size:18px;margin:0}
.menu{display:flex;flex-direction:column;gap:8px;padding:14px}
.mitem{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;font:inherit;font-size:18px;font-weight:600;text-align:start;background:transparent;color:var(--text);border:1px solid var(--line);border-radius:14px;padding:15px;cursor:pointer}
.mitem em{font-style:normal;font-size:14px;color:var(--accent-text);background:var(--accent);border-radius:999px;padding:1px 10px}
.dsum{padding:10px 14px;font-size:14px;color:var(--muted);border-bottom:1px solid var(--line)}
.dsum b{color:var(--price)}
.rec{display:flex;flex-direction:column;flex:1;min-height:0}
.dlist{flex:1;overflow-y:auto;padding:12px 14px calc(20px + env(safe-area-inset-bottom,0px))}
.dlist .car .shot{max-height:130px}
@media (prefers-reduced-motion: reduce){.drawer,.veil{transition:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 2px 14px}
h1{font-size:22px;margin:0}
.card{background:transparent;border:1px solid color-mix(in srgb,var(--accent) 40%,var(--line));border-radius:16px;padding:14px;margin-bottom:14px}
label{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
input[type=text],input[type=tel],input[type=search],input[type=email],input[type=password],select{
  width:100%;font:inherit;font-size:18px;padding:13px 14px;border-radius:12px;
  border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:color-mix(in srgb,var(--text) 5%,transparent);color:var(--text);outline:none;
}
input:focus,select:focus,button:focus-visible{border-color:var(--accent);outline:2px solid var(--accent);outline-offset:1px}
.ltr{direction:ltr;text-align:right}
.btn{
  width:100%;font:inherit;font-size:18px;font-weight:700;border:0;border-radius:14px;
  padding:15px;background:var(--accent);color:var(--accent-text);cursor:pointer
}
.btn:disabled{opacity:.55}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-size:14px;font-weight:600;padding:8px 12px;width:auto}
.btn.small{font-size:14px;padding:8px 12px;width:auto;border-radius:10px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.msg{font-size:14px;margin-top:10px;min-height:20px}
.msg.err{color:var(--danger)} .msg.ok{color:var(--price)}
.bar{display:flex;gap:8px;align-items:center;margin-bottom:10px}
.bar input{flex:1}
.stats{display:flex;gap:8px;margin-bottom:12px}
.chip{flex:1;background:var(--chip);color:var(--price);border-radius:12px;padding:10px 12px;font-size:13px}
.chip b{display:block;font-size:19px}
.filters{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.filters button{
  font:inherit;font-size:14px;white-space:nowrap;border:1px solid color-mix(in srgb,var(--accent) 35%,var(--line));background:transparent;
  color:var(--text);border-radius:999px;padding:7px 14px;cursor:pointer
}
.filters button.on{background:var(--accent);color:var(--accent-text);border-color:var(--accent)}
.car .plate{font-size:20px;font-weight:700;color:var(--price);direction:ltr;text-align:right}
.car .row{margin-top:4px;font-size:15px}
.car .row span{color:var(--muted)}
.car .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.car .acts a{
  text-decoration:none;font-size:14px;font-weight:600;color:var(--accent);
  border:1px solid var(--line);border-radius:10px;padding:8px 12px
}
.car .foot{display:flex;gap:8px;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
.car .foot select{width:auto;font-size:15px;padding:8px 10px;flex:1}
.car .date{font-size:12px;color:var(--muted);margin-top:8px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.banner{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.photoBtn{display:flex;align-items:center;justify-content:center;min-height:56px;border:2px dashed color-mix(in srgb,var(--accent) 50%,var(--line));border-radius:12px;background:transparent;color:var(--muted);cursor:pointer;overflow:hidden;position:relative;font-size:16px}
.photoBtn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.photoBtn img{width:100%;max-height:260px;object-fit:cover;display:block}
.car .shot{width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin-bottom:10px;display:block}
.car .amount{font-weight:700;color:var(--price)}
.hidden{display:none!important}
</style>
</head>
<body>
<canvas id="stars" aria-hidden="true"></canvas>
<div class="wrap">
  <div class="top">
    <div class="brand">
      <button class="burger hidden" id="burger" type="button" aria-label="القائمة" aria-controls="drawer" aria-expanded="false"><i></i><i></i><i></i></button>
      <div><h1>الأصدقاء</h1><div class="who hidden" id="who"></div></div>
    </div>
    <button class="btn ghost hidden" id="switchUser" type="button">تسجيل الخروج</button>
  </div>

  <div id="banner" class="banner hidden"></div>

  <!-- تسجيل الدخول -->
  <div class="card hidden" id="pickCard">
    <p class="pickTitle">تسجيل الدخول</p>
    <div class="field">
      <label for="aUser">الاسم</label>
      <input id="aUser" type="text" autocomplete="username" autocapitalize="none" placeholder="اكتب اسمك">
    </div>
    <div class="field">
      <label for="aPass">كلمة المرور</label>
      <input id="aPass" class="ltr" type="password" autocomplete="current-password">
    </div>
    <p class="msg">سيبقى دخولك محفوظًا على هذا الجهاز.</p>
    <button class="btn" id="aLogin" type="button">دخول</button>
    <div class="msg" id="aMsg"></div>
  </div>

  <!-- التطبيق -->
  <div id="app" class="hidden">
    <div class="card" id="formCard">
      <div class="field">
        <label for="phone">رقم الزبون</label>
        <input id="phone" class="ltr" type="text" autocomplete="off" placeholder="09XXXXXXXX">
      </div>
      <div class="field">
        <label>تصوير السيارة</label>
        <div class="photoBtn" id="photoBox">
          <span id="photoHint">📷 اضغط لالتقاط صورة</span>
          <input id="photo" type="file" accept="image/*" capture="environment" aria-label="تصوير السيارة">
        </div>
      </div>
      <div class="field">
        <label for="amount">السعر</label>
        <input id="amount" class="ltr" type="text" autocomplete="off" placeholder="مثال: 150">
      </div>
      <div class="field">
        <label>نوع العمل</label>
        <div class="seg" id="seg"></div>
      </div>
      <div class="field">
        <label>المواد</label>
        <div class="seg two" id="segMat"></div>
      </div>
      <button class="btn" id="save" type="button">حفظ في السجل</button>
      <div class="msg" id="msg"></div>
    </div>

    <div class="bar"><input id="q" type="search" class="ltr" placeholder="🔍 ابحث برقم الزبون"></div>

    <div class="stats">
      <div class="chip">داخل الورشة<b id="cnt">0</b></div>
      <div class="chip">إجمالي القيمة<b id="sumIn">0</b></div>
    </div>

    <div id="list"></div>
  </div>
</div>

<div class="modal hidden" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT">
  <div class="box">
    <h3 id="dlgT">تأكيد التسليم</h3>
    <div class="req">المبلغ المطلوب: <b id="dReq">0</b></div>
    <div class="warnBox hidden" id="dMat"></div>
    <div class="field"><label for="dPaid">المبلغ المدفوع</label><input id="dPaid" class="ltr" type="text" autocomplete="off"></div>
    <div class="diff" id="dDiff"></div>
    <div class="field hidden" id="dNoteBox"><label for="dNote">سبب التخفيض</label><input id="dNote" type="text" autocomplete="off" placeholder="اكتب السبب"></div>
    <div class="msg" id="dMsg"></div>
    <div class="mbtns"><button class="btn" id="dOk" type="button">تأكيد التسليم</button><button class="btn plain" id="dCancel" type="button">إلغاء</button></div>
  </div>
</div>
<div class="veil" id="veil"></div>
<aside class="drawer" id="drawer" aria-label="القائمة" aria-hidden="true">
  <div class="dhead">
    <button class="btn small plain hidden" id="back" type="button">→ رجوع</button>
    <h2 id="dtitle">القائمة</h2>
    <button class="btn small plain" id="close" type="button">إغلاق</button>
  </div>
  <div class="menu" id="menu">
    <button class="mitem" id="goRecords" type="button"><span>📋 السجل (المُسلَّمة)</span><em id="cntTab">0</em></button>
    <button class="mitem" id="goNotif" type="button"><span>🔔 الإشعارات</span></button>
    <button class="mitem hidden" id="goStaff" type="button"><span>👥 الموظفون</span></button>
    <button class="mitem hidden" id="goCode" type="button"><span>🧩 الكود المباشر</span></button>
    <button class="mitem" id="goShare" type="button"><span>📤 مشاركة البرنامج</span></button>
    <div class="msg" id="shareMsg"></div>
  </div>
  <div class="rec hidden" id="notifView">
    <div class="dlist">
      <div class="card">
        <p class="pickTitle">هذا الجهاز</p>
        <div class="msg" id="pStatus"></div>
        <button class="btn" id="pToggle" type="button">تفعيل الإشعارات</button>
      </div>
      <div class="card hidden" id="evCard">
        <p class="pickTitle">الأحداث التي ترسل إشعارًا</p>
        <div id="evList"></div>
        <div class="msg" id="evMsg"></div>
      </div>
    </div>
  </div>
  <div class="rec hidden" id="staffView">
    <div class="dlist">
      <div class="card">
        <p class="pickTitle">إنشاء حساب موظف</p>
        <div class="field"><label for="sName">اسم الموظف</label><input id="sName" type="text" autocomplete="off"></div>
        <div class="field"><label for="sPass">كلمة المرور (6 أحرف فأكثر)</label><input id="sPass" class="ltr" type="text" autocomplete="off"></div>
        <label class="chk"><input type="checkbox" id="sRec"><span>السماح له بالاطلاع على السجل</span></label>
        <button class="btn" id="sAdd" type="button">إنشاء الحساب</button>
        <div class="msg" id="sMsg"></div>
      </div>
      <div id="sList"></div>
    </div>
  </div>
  <div class="rec hidden" id="codeView">
    <div class="dlist">
      <div class="card">
        <p class="pickTitle">الكود المباشر (JavaScript)</p>
        <div class="field"><label for="cCode">الصق الكود هنا</label>
          <textarea id="cCode" rows="12" spellcheck="false" autocapitalize="off" autocomplete="off" style="width:100%;box-sizing:border-box;direction:ltr;text-align:left;font-family:monospace;font-size:13px;padding:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text)"></textarea></div>
        <button class="btn" id="cPub" type="button">نشر الكود للجميع</button>
        <button class="btn danger" id="cOff" type="button" style="margin-top:8px">تعطيل الكود الحالي</button>
        <div class="msg" id="cMsg"></div>
      </div>
    </div>
  </div>
  <div class="rec hidden" id="recView">
    <div class="dsum hidden" id="dsum">إجمالي المدفوع: <b id="dtotal">0</b></div>
    <div class="dlist" id="dlist"></div>
  </div>
</aside>

<script>
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>

  let photoData = '';
  function compressImage(file, maxSide, quality){
    return new Promise((resolve, reject) => {
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = () => {
        const k = Math.min(1, maxSide / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * k);
        c.height = Math.round(img.height * k);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('img')); };
      img.src = url;
    });
  }

      if(error) failed = true; else prof = data;

      try {

      } catch(e){}
      if(!prof) return 'تعذر التحقق من الحساب. تأكد من الاتصال بالإنترنت ثم أعد فتح التطبيق.';

      mtag.innerHTML = r.with_materials ? BRUSH + ' بالمواد' : '❌ بلا مواد';

    card.appendChild(sv);

    card.appendChild(line('السعر', fmt(r.amount)));

    const tot = document.createElement('div'); tot.className = 'total';
    tot.textContent = 'الإجمالي: ' + fmt(totalOf(r));
    card.appendChild(tot);
    if(r.with_materials === true){
      card.appendChild(line('المواد (تُخصم منك)', num(r.materials_cost) > 0 ? fmt(r.materials_cost) : 'لم تُحدَّد بعد'));
    }

    if(delivered){
      card.appendChild(line('المدفوع', fmt(r.paid !== null && r.paid !== undefined ? r.paid : totalOf(r))));
      if(r.paid !== null && r.paid !== undefined && num(r.paid) < totalOf(r)){
        card.appendChild(line('تخفيض', fmt(totalOf(r) - num(r.paid)) + (r.discount_note ? ' — ' + r.discount_note : '')));
      }
    }

    if(delivered && r.with_materials === true && num(r.materials_cost) > 0){
      const pv = r.paid !== null && r.paid !== undefined ? num(r.paid) : totalOf(r);
      card.appendChild(line('المتبقي لك بعد المواد', fmt(pv - num(r.materials_cost))));

    acts.appendChild(call); acts.appendChild(wa);

      const mi = mf.querySelector('.ma');

      mf.appendChild(mk('حفظ قيمة المواد', 'done', async () => {

        if(a === '' || !(Number(a) >= 0)){ setMsg(m, 'أدخل قيمة المواد بالأرقام', 'err'); return; }
        await patch(r, { materials_cost: Number(a) });
      }));
      const mb = mk('', 'plain', () => mf.classList.toggle('hidden'));
      mb.innerHTML = BRUSH + ' ' + (num(r.materials_cost) > 0 ? 'تعديل قيمة المواد' : 'إضافة قيمة المواد');
      mrow.appendChild(mb);
      card.appendChild(mrow);
      card.appendChild(mf);
    }

    const foot = document.createElement('div');
    foot.className = 'foot';
    if(delivered){
      foot.appendChild(mk('↩ إرجاع للورشة', 'plain', () => patch(r, { status: STATUSES[0], paid: null, discount_note: null })));
    } else {

        '<div class="msg xm"></div>';

        if(!n){ setMsg(m, 'اكتب ملاحظة', 'err'); return; }
        await patch(r, { extras: extrasOf(r).concat([{ amount: Number(a), note: n, by: worker, at: new Date().toISOString() }]) });
      });
      form.appendChild(ok);
      foot.appendChild(mk('➕ زيادة القيمة', 'plain', () => form.classList.toggle('hidden')));
      foot.appendChild(mk('✅ تسليم', 'done', () => openDeliver(r)));
      card.appendChild(foot);

  (function(){
    const cv = $('stars'), cx = cv.getContext('2d');
    let W = 0, H = 0, stars = [], color = '255,138,61';
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    function readColor(){
      const m = /^#([0-9a-f]{6})$/i.exec(getComputedStyle(document.documentElement).getPropertyValue('--accent').trim());
      if(m){ const n = parseInt(m[1], 16); color = (n >> 16 & 255) + ',' + (n >> 8 & 255) + ',' + (n & 255); }
    }
    function size(){
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      W = innerWidth; H = innerHeight;
      cv.width = W * dpr; cv.height = H * dpr;
      cx.setTransform(dpr, 0, 0, dpr, 0, 0);
      const n = Math.max(120, Math.min(300, Math.round(W * H / 2800)));
      stars = [];
      for(let i = 0; i < n; i++) stars.push({ x: Math.random() * W, y: Math.random() * H, r: 0.35 + Math.random() * 0.7,
        vy: 0.08 + Math.random() * 0.22, vx: (Math.random() - 0.5) * 0.12, ph: Math.random() * 6.28, sp: 0.6 + Math.random() * 1.6 });
      draw(0);
    }
    function draw(t){
      cx.clearRect(0, 0, W, H);
      for(const s of stars){
        const a = 0.25 + 0.6 * (0.5 + 0.5 * Math.sin(s.ph + t * 0.001 * s.sp));
        cx.fillStyle = 'rgba(' + color + ',' + a.toFixed(2) + ')';
        cx.beginPath(); cx.arc(s.x, s.y, s.r, 0, 6.2832); cx.fill();
        if(!still){
          s.y -= s.vy; s.x += s.vx;
          if(s.y < -4){ s.y = H + 4; s.x = Math.random() * W; }
          if(s.x < -4) s.x = W + 4; else if(s.x > W + 4) s.x = -4;
        }
      }
    }
    function loop(t){ if(!document.hidden) draw(t); requestAnimationFrame(loop); }
    readColor(); size();
    addEventListener('resize', size);
    if(window.matchMedia) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTimeout(() => { readColor(); draw(0); }, 50));
    if(!still) requestAnimationFrame(loop);
  })();
})();

    setTimeout(function(){ set(SK, JSON.stringify({id:row.id, n:0})); }, 5000);
  }
